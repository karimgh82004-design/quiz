<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="madrid">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>بيننا — مساحتك أنت وأصحابك</title>
<meta name="theme-color" content="#101E3B">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;800&display=swap">
<style>
:root{--bg:#F5F1E8;--card:#FFFFFF;--ink:#101E3B;--mut:#5B6578;--a:#C6A632;--b:#101E3B;--soft:#EEE7D2;--line:rgba(16,30,59,.13);--btn:linear-gradient(135deg,#14264A,#223A66);--lg1:#C6A632;--lg2:#101E3B;--inb:#fff;--inc:#111;--ok:#1f9d57;--bad:#d64545;--sh:0 1px 2px rgba(16,30,59,.06),0 10px 26px -14px rgba(16,30,59,.30);--r:20px}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0B1220;--card:#142038;--ink:#F3EEDF;--mut:#A3AEC4;--a:#C6A632;--b:#D8B73F;--soft:#22304E;--line:rgba(243,238,223,.15);--btn:linear-gradient(135deg,#D8B73F,#B08F22);--lg1:#6F5B1B;--lg2:#D8B73F;--inb:#0B1220;--inc:#F3EEDF;--ok:#35c27a;--bad:#ef6a6a;--sh:0 1px 2px rgba(0,0,0,.4),0 12px 30px -14px rgba(0,0,0,.75)}
*{box-sizing:border-box}
button{-webkit-tap-highlight-color:transparent;font:inherit;color:inherit}
html,body{margin:0;min-height:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;font-weight:500;line-height:1.65}
:focus-visible{outline:3px solid #C6A63299;outline-offset:2px}
#app{max-width:520px;margin:0 auto;padding:0 16px 24px;text-align:center}

/* ---------- brand ---------- */
.brand{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink);text-decoration:none;margin:2px auto 12px}.brand[data-a]{cursor:pointer}
.brand-mark{position:relative;width:94px;aspect-ratio:160/122}
.brand-mark svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.brand-ar{position:absolute;z-index:1;left:43.75%;top:37.3%;transform:translate(-50%,-50%);white-space:nowrap;font-size:25px;line-height:1;font-weight:800;color:#101E3B}
.brand-en{font-family:Arial,sans-serif;font-size:25px;font-weight:800;letter-spacing:-.8px;line-height:1.1;color:var(--ink);direction:ltr}
.brand-tag{font-size:12px;font-weight:800;color:#C6A632;margin-top:5px}
.brand-tag:before,.brand-tag:after{content:"";display:inline-block;width:17px;height:2px;background:#C6A632;vertical-align:middle;margin:0 7px}
.brand.large{margin:4px auto 18px}.brand.large .brand-mark{width:160px}.brand.large .brand-ar{font-size:43px}.brand.large .brand-en{font-size:39px}.brand.large .brand-tag{font-size:14px}
.welcome-note{line-height:1.9;color:var(--ink);margin:8px 0 16px}

/* ---------- header ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin:0 -16px 14px;padding:8px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.top .brand{margin:0;gap:0}.top .brand-en,.top .brand-tag{display:none}.top .brand-mark{width:58px}.top .brand-ar{font-size:15.5px}
.me{justify-self:start;display:inline-flex;align-items:center;gap:8px;max-width:100%;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:3px 12px 3px 6px;cursor:pointer;box-shadow:var(--sh)}
.me .mn{max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:800;font-size:14px}.me .cv{font-size:11px;opacity:.6}
.ib{justify-self:end;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:18px;box-shadow:var(--sh)}
.menu{position:absolute;top:calc(100% + 6px);inset-inline-start:12px;min-width:220px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 40px -12px rgba(0,0,0,.35);padding:6px;text-align:right;z-index:40}
.menu[hidden]{display:none}
.menu button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:11px 12px;border-radius:12px;cursor:pointer;font-weight:700;text-align:right}
.menu button:hover{background:var(--soft)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.nav{text-align:right;margin:-4px 0 6px}
.tg{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:20px;padding:6px 12px;font:inherit;cursor:pointer}

/* ---------- surfaces ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px;margin:12px 0;box-shadow:var(--sh)}
h1,h2,h3{margin:6px 0;font-weight:800;line-height:1.35}
h1{font-size:clamp(25px,5vw,32px)}h2{font-size:clamp(20px,3.6vw,25px)}h3{font-size:18px}
.hero{font-size:60px;line-height:1.1}
.small{font-size:13px;color:var(--mut)}
.err{color:var(--bad)}
.sec{text-align:right;font-size:14px;color:var(--mut);margin:20px 4px 4px;font-weight:800}
.ok{color:var(--ok)}

/* ---------- buttons ---------- */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:52px;border:0;border-radius:16px;padding:12px 16px;margin-top:12px;background:var(--btn);color:#fff;font-weight:800;font-size:17px;cursor:pointer;text-decoration:none;transition:transform .12s,filter .15s}
.btn:hover{filter:brightness(1.07)}.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btn.soft{background:var(--soft);color:var(--ink)}
.btn.tt{background:#111;color:#fff}
.btn.red{background:var(--bad);color:#fff}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.wa{background:#1f9d57;color:#fff}
.btn.gold{background:linear-gradient(135deg,#E8CB5A,#B8962A);color:#101E3B;box-shadow:0 10px 24px -10px #b8962aaa}
:root[data-theme="dark"] .btn{color:#101E3B}
:root[data-theme="dark"] .btn.soft,:root[data-theme="dark"] .btn.ghost{color:var(--ink)}
:root[data-theme="dark"] .btn.tt,:root[data-theme="dark"] .btn.red,:root[data-theme="dark"] .btn.wa{color:#fff}
:root[data-theme="dark"] .btn.tt{background:#000;border:1px solid #333}
.mini{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
.mini.gold{background:linear-gradient(135deg,#E8CB5A,#B8962A);color:#101E3B;border-color:#B08F22;font-weight:800}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:8px}.seg button{flex:1;border:1.5px solid var(--line);background:var(--card);border-radius:14px;padding:10px 6px;font-weight:800;cursor:pointer}
.seg button.on{background:var(--soft);border-color:var(--a)}

/* ---------- inputs ---------- */
input.t,textarea.t,select.t{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px;font:inherit;font-size:17px;text-align:center;background:var(--inb);color:var(--inc);margin-top:6px}
input.t:focus,textarea.t:focus,select.t:focus{outline:3px solid #C6A63255;outline-offset:1px;border-color:var(--a)}
textarea.t{min-height:130px;text-align:right;resize:vertical}
input.code{font-size:26px;font-weight:800;letter-spacing:.3em;direction:ltr;text-transform:uppercase}

/* ---------- home tiles ---------- */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:8px 0 14px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:8px;text-align:right;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px;color:var(--ink);cursor:pointer;box-shadow:var(--sh);transition:transform .15s,border-color .15s}
.tile:hover{border-color:var(--a)}.tile:active{transform:translateY(2px)}
.tile .ti{display:grid;place-items:center;width:46px;height:46px;border-radius:14px;background:var(--soft);font-size:25px;font-style:normal}
.tile b{font-size:16px;font-weight:800;line-height:1.3}
.tile small{font-size:12.5px;color:var(--mut);line-height:1.55;font-weight:500}
.tile.feat{grid-column:1/-1;flex-direction:row;align-items:center;gap:14px;background:linear-gradient(135deg,#E8CB5A,#B8962A);border-color:#9C7D1E;color:#101E3B;padding:18px;box-shadow:0 16px 30px -16px #b8962add}
.tile.feat .ti{width:58px;height:58px;font-size:32px;background:#ffffff59}
.tile.feat b{font-size:19px}.tile.feat small{color:#101E3Bcc}
.tile.feat .tx{flex:1;display:flex;flex-direction:column;gap:2px}
.tile.feat em{font-style:normal;background:#101E3B;color:#E8CB5A;border-radius:999px;font-size:11px;font-weight:800;padding:2px 9px;align-self:flex-start}
.me-card{display:flex;align-items:center;gap:14px;text-align:right}
.me-card .tx{flex:1;min-width:0}.me-card h2{margin:0}
.me-card .acts{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}

/* ---------- avatars ---------- */
.av{--s:44px;display:inline-grid;place-items:center;flex:none;width:var(--s);height:var(--s);border-radius:50%;background:var(--soft);color:var(--ink);font-size:calc(var(--s)*.52);font-weight:800;overflow:hidden;border:2px solid var(--a);line-height:1}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.avp{display:flex;flex-direction:column;align-items:center;gap:10px;margin:8px 0}
.avb{display:flex;gap:8px}
.emos{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;margin:8px 0 12px}
.emo{border:1.5px solid var(--line);background:var(--card);border-radius:12px;padding:4px 0;font-size:22px;cursor:pointer;line-height:1.5}
.emo.on{border-color:var(--a);background:var(--soft)}

/* ---------- quiz / polls ---------- */
.dots{display:flex;gap:4px;justify-content:center;margin-bottom:8px}
.dots i{flex:1;max-width:26px;height:8px;border-radius:6px;background:var(--soft)}.dots i.on{background:var(--a)}
.list{display:grid;gap:10px;margin-top:14px}
.opt{display:flex;align-items:center;gap:12px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:14px;font:inherit;font-weight:800;font-size:18px;cursor:pointer;text-align:right;transition:background .2s,transform .2s,border-color .2s}
.opt:hover{border-color:var(--a)}
.opt span{font-size:30px}
.opt>b{margin-inline-start:auto}
.opt .ot{display:flex;flex-direction:column;gap:2px}.opt .ot small{font-weight:500;font-size:12.5px;color:var(--mut)}
.opt.sel{background:var(--soft);border-color:var(--a);transform:scale(.98)}
.opt.ok{background:#22c55e;border-color:#15803d;color:#fff}.opt.bad{background:#ef4444;border-color:#b91c1c;color:#fff}.opt.dim{opacity:.45}
.bq{background:var(--bg);border-radius:16px;padding:10px;margin:10px 0;text-align:right}
.orow{display:flex;gap:8px;align-items:center}
.ck{flex:none;width:34px;height:34px;margin-top:6px;border-radius:50%;border:2px solid var(--line);background:var(--inb);color:var(--inc);cursor:pointer;font-size:16px}.ck.on{background:#22c55e;color:#fff;border-color:#15803d}
.score{font-size:60px;font-weight:800;color:var(--b)}
.ring{--p:0;width:176px;aspect-ratio:1;border-radius:50%;margin:12px auto;display:grid;place-items:center;background:conic-gradient(var(--a) calc(var(--p)*1%),var(--soft) 0)}
.ring .rn{width:82%;aspect-ratio:1;border-radius:50%;background:var(--card);display:grid;place-content:center;line-height:1.1}
.ring .rn b{font-size:48px;font-weight:800;color:var(--b)}.ring .rn span{font-size:16px;color:var(--mut)}
.row{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:14px;padding:8px 12px;margin:6px 0;text-align:right}
.row b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}.row em{font-style:normal;font-weight:800;color:var(--b)}
.link{direction:ltr;word-break:break-all;background:var(--bg);border-radius:12px;padding:10px;font-size:13px;margin:8px 0}
.cd{background:var(--soft);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:8px;font-weight:800;margin-bottom:8px;direction:ltr}
.bar{height:12px;border-radius:8px;background:var(--soft);overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--btn);border-radius:8px}
:root[data-theme="dark"] .bar i{background:linear-gradient(90deg,#B08F22,#E3C34A)}
.bar.g i{animation:grow .7s ease-out}
.pr{text-align:right;margin:12px 0}.pr div{display:flex;justify-content:space-between}
.msg{background:var(--bg);border-radius:14px;padding:12px;margin:8px 0;text-align:right;white-space:pre-wrap;word-break:break-word}
.msg small{display:flex;justify-content:space-between;opacity:.7;margin-top:6px}.msg a{color:var(--bad);cursor:pointer}
.sum{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border-radius:14px;padding:8px 12px;margin:6px 0;text-align:right}
.hl{display:flex;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap;font-size:14px;margin-bottom:6px}
.itm{display:flex;gap:8px;align-items:stretch;margin-top:8px}.itm .opt{flex:1;margin:0;width:auto}
.dl{flex:none;width:54px;border:1.5px solid var(--bad);background:transparent;color:var(--bad);border-radius:18px;font-size:22px;cursor:pointer}

/* ---------- wheel / tod / misc ---------- */
.wheel-box{position:relative;width:100%;max-width:320px;margin:10px auto 0}
.wheel-box canvas{width:100%;height:auto;display:block;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ptr{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:30px solid #C6A632;filter:drop-shadow(0 2px 2px #0007);z-index:2;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--bg);border:1.5px solid var(--a);border-radius:20px;padding:4px 6px 4px 12px;font-weight:800;font-size:15px}
.chip button{border:0;background:var(--soft);color:var(--ink);border-radius:50%;width:24px;height:24px;cursor:pointer;font-size:12px;line-height:1}
.ov{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:16px;z-index:50;overflow:auto}
.ov .card{width:100%;max-width:420px;margin:0;position:relative;z-index:1}
.ov .ovbg{position:absolute;inset:0}
.pop{animation:pop .35s ease-out}
.wname{font-size:34px;word-break:break-word;margin:4px 0 10px}
.wadd{width:auto!important;flex:none;margin-top:6px!important;padding:10px 18px!important}
.tdq{font-size:clamp(18px,3.4vw,22px);line-height:1.9;font-weight:800;margin:10px 0}
.tdc.dare{border-color:#B5443B}
.pvimg{width:100%;max-height:60vh;object-fit:contain;border-radius:14px;box-shadow:0 10px 30px -10px rgba(0,0,0,.5);background:#0d1730}
.toast{position:fixed;inset-inline:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:360px;background:#101E3B;color:#fff;border:1px solid #C6A632;border-radius:14px;padding:11px 16px;font-weight:800;z-index:80;text-align:center;box-shadow:0 14px 30px -10px rgba(0,0,0,.5);animation:pop .25s ease-out}

/* ---------- rooms ---------- */
.rcode{font-size:46px;font-weight:800;letter-spacing:.2em;direction:ltr;color:var(--b);line-height:1.2;margin:2px 0 4px;padding-inline-start:.2em}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin:10px 0}
.pl{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 6px 10px;border-radius:16px;background:var(--bg);border:1.5px solid transparent;font-weight:800;font-size:13.5px;min-width:0}
.pl .nm{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl.me{border-color:var(--a)}
.pl .tag{position:absolute;top:2px;inset-inline-end:6px;font-size:15px}
.pl .rd{font-size:11px;color:var(--ok);font-weight:700}
.pl .kk{position:absolute;top:4px;inset-inline-start:4px;width:22px;height:22px;border:0;border-radius:50%;background:var(--soft);cursor:pointer;font-size:10px;line-height:1}
.pl.done .av{border-color:var(--ok)}
button.pl{cursor:pointer;font:inherit;color:inherit}
button.pl:hover{border-color:var(--a)}
button.pl.sel{background:var(--soft);border-color:var(--a)}
.pgrid.dim button.pl:not(.sel){opacity:.45}
.vstrip{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin:10px 0 2px}
.vstrip .av{opacity:.35;filter:grayscale(1);border-color:var(--line)}.vstrip .av.on{opacity:1;filter:none;border-color:var(--ok)}
.vv{display:flex;gap:-6px;flex-wrap:wrap;gap:4px;margin-top:6px;min-height:8px}
.ropt{text-align:right;border:1.5px solid var(--line);border-radius:18px;padding:12px;margin-top:10px;background:var(--card)}
.ropt.win{border-color:var(--a);background:var(--soft)}
.ropt .rh{display:flex;align-items:center;gap:10px;font-weight:800;font-size:17px}.ropt .rh b{margin-inline-start:auto}
.ropt .rh span{font-size:28px}
.crown{font-size:46px;line-height:1}
.rwin{display:flex;flex-direction:column;align-items:center;gap:6px;margin:6px 0 10px}
.rrow{display:flex;align-items:center;gap:10px;background:var(--bg);border-radius:14px;padding:8px 12px;margin:6px 0;text-align:right}
.rrow .nm{flex:1;min-width:0;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rrow em{font-style:normal;font-weight:800;color:var(--b)}
.rrow .md{width:28px;text-align:center;font-size:20px}
.recap{text-align:right;font-size:14px;line-height:1.7}
.recap div{padding:6px 0;border-bottom:1px dashed var(--line)}.recap div:last-child{border:0}

/* ---------- footer ---------- */
.foot{margin:22px auto 6px;display:flex;gap:10px;justify-content:center;max-width:420px}
.foot a{flex:1;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--card);border-radius:14px;padding:9px;font-weight:800;font-size:14px}
.foot a.tk{background:#111;color:#fff;border-color:#111}
:root[data-theme="dark"] .foot a.tk{background:#000;border-color:#333}

@keyframes grow{from{width:0}}
@keyframes pop{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
.tile:active,.btn:active{transform:translateY(1px)}
@media(max-width:699px){.cards .tile:last-child:nth-child(odd):not(.feat){grid-column:1/-1}}
@media(max-width:380px){#app{padding:0 12px 20px}.top{margin:0 -12px 12px;padding:8px 12px}.tile{padding:12px}.btn{font-size:16px}.opt{font-size:16px;padding:12px}.me .mn{max-width:70px}.emos{grid-template-columns:repeat(4,1fr)}}
@media(min-width:700px){#app{max-width:720px;padding:0 28px 28px}.top{margin:0 -28px 16px;padding:10px 28px}.card{padding:26px}.cards{grid-template-columns:repeat(3,1fr)}.tile.feat{grid-column:1/-1}.btn{font-size:18px}.opt{font-size:19px}.hero{font-size:68px}.wheel-box{max-width:400px}.foot{max-width:420px}}
@media(min-width:1100px){#app{max-width:760px}}
@media(prefers-reduced-motion:reduce){.pop,.toast{animation:none}.bar.g i{animation:none}}
</style>
</head>

function rexit(){const m=RM;if(!m)return;m.left=1;try{m.u.forEach(f=>f&&f())}catch(e){}
 if(S.u&&m.did){try{const pr=ref(db,`roomPlayers/${m.code}/${S.u.uid}`);onDisconnect(pr).cancel();remove(pr).catch(()=>{})}catch(e){}}
 RM=null;RC=null;try{sessionStorage.removeItem("rc")}catch(e){}
 try{if(location.search)history.replaceState(history.state,"",BASE)}catch(e){}}
function rjoinWrite(){const m=RM;if(!m||m.left||!S.u)return;
 const pr=ref(db,`roomPlayers/${m.code}/${S.u.uid}`),d={uid:S.u.uid,name:String(S.alias||S.name||"لاعب").slice(0,20),ready:true,joinedAt:m.joinedAt};
 if(S.avatar&&S.avatar.length<90000)d.avatar=S.avatar;
 set(pr,d).then(()=>{if(RM===m&&!m.left){try{onDisconnect(pr).remove()}catch(e){}}}).catch(e=>{m.jerr=ec(e);rrender()})}
function rOpen(code){if(RM)rexit();
 const m=RM={code,room:null,players:{},votes:{},names:{},off:0,host:false,joinedAt:Date.now(),act:"",u:[],did:0,seen:0};
 try{sessionStorage.setItem("rc",code)}catch(e){}
 const fail=e=>{if(RM!==m)return;m.err=ec(e);rrender()};
 m.u.push(onValue(ref(db,".info/serverTimeOffset"),s=>{m.off=+s.val()||0},()=>{}));
 m.u.push(onValue(ref(db,"rooms/"+code),s=>{if(RM!==m)return;const v=s.val();
  if(!v){const had=m.seen;rexit();S.msg=had?"المضيف أنهى الغرفة":"الغرفة مش موجودة أو انتهت";go("rgone");return}
  if(v.kick&&v.kick[S.u.uid]){rexit();S.msg="المضيف أخرجك من الغرفة";go("rgone");return}
  m.room=v;m.host=v.owner===S.u.uid;m.seen=1;if(S.s!=="room")go("room");else rrender()},fail));
 m.u.push(onValue(ref(db,"roomPlayers/"+code),s=>{if(RM!==m)return;const v=s.val()||{};m.players=v;
  Object.values(v).forEach(p=>{if(p&&p.uid)m.names[p.uid]={n:String(p.name||"لاعب"),av:typeof p.avatar==="string"?p.avatar:""}});
  if(!m.did){m.did=1;if(Object.keys(v).length>=MAXP&&!v[S.u.uid]){rexit();S.msg="الغرفة ممتلئة (الحد الأقصى "+MAXP+" لاعب)";go("rgone");return}rjoinWrite()}
  rrender()},fail));
 m.u.push(onValue(ref(db,"roomVotes/"+code),s=>{if(RM!==m)return;m.votes=s.val()||{};rrender()},fail));
 m.u.push(onValue(ref(db,".info/connected"),s=>{if(s.val()===true&&RM===m&&m.did)rjoinWrite()},()=>{}))}
async function rEnter(code){code=String(code||"").trim().toUpperCase();
 if(!/^[A-Z0-9]{4,8}$/.test(code)){S.msg="كود الغرفة مش صحيح";go("rhome");return}
 S.msg="";S.lt="جاري دخول الغرفة...";go("load");
 if(!await ensureAuth()){go("rhome");return}
 let r=null;try{r=(await W(get(ref(db,"rooms/"+code)))).val()}catch(e){S.msg="تعذّر فتح الغرفة ("+ec(e)+")";go("rhome");return}
 if(!r){S.msg="الغرفة مش موجودة أو انتهت";RC=null;try{sessionStorage.removeItem("rc")}catch(e){}go("rhome");return}
 if(!S.alias){S.rpend=code;S.pn="";go("rname");return}
 rOpen(code)}
function rScores(r){const pts={};
 for(let i=0;i<(r.n||0);i++){const es=Object.entries(rvs(r,i));if(!es.length)continue;
  if(r.game==="who")es.forEach(([u,x])=>{if(RM.names[x.choice])pts[x.choice]=(pts[x.choice]||0)+1});
  else{const c=[0,0];es.forEach(([u,x])=>{const k=+x.choice;if(k===0||k===1)c[k]++});const mx=Math.max(c[0],c[1]);
   es.forEach(([u,x])=>{const k=+x.choice;pts[u]=pts[u]||0;if((k===0||k===1)&&c[k]===mx)pts[u]++})}}
 rpl().forEach(p=>{if(pts[p.uid]==null)pts[p.uid]=0});
 return Object.entries(pts).filter(([u])=>RM.names[u]).map(([u,v])=>({uid:u,n:rnm(u).n,av:rnm(u).av,v})).sort((a,b)=>b.v-a.v)}

const pcell=(p,o={})=>`<div class="pl ${p.uid===S.u.uid?"me":""} ${o.done?"done":""}">${p.uid===RM.room.owner?'<span class="tag" title="المضيف">👑</span>':""}${av(p.avatar,54,p.name)}<span class="nm">${esc(p.name)}</span>${o.sub?`<span class="rd">${o.sub}</span>`:""}${o.kick&&RM.host&&p.uid!==S.u.uid?`<button class="kk" data-a="rkick" data-v="${esc(p.uid)}" aria-label="إخراج ${esc(p.name)}">✕</button>`:""}</div>`;
function rLobby(r){const pl=rpl(),link=BASE+"?r="+RM.code,g=RG[r.game]||RG.wyr,
 wa="https://wa.me/?text="+encodeURIComponent(`تعال العب معي «${g.n}» على بيننا 🎉\nكود الغرفة: ${RM.code}\n${link}`);
 return card(`<div class="small">${g.i} ${g.n}: ${r.n} أسئلة${r.tm?" و"+r.tm+" ثانية لكل سؤال":" بدون وقت"}</div><div class="small" style="margin-top:10px">كود الغرفة</div><div class="rcode" id="rcode">${esc(RM.code)}</div><div class="link">${esc(link)}</div><div class="row2">${btn("copy","📋 نسخ الرابط",link,"soft")}${btn("rshare","📤 مشاركة",link)}</div><a class="btn wa" href="${wa}" target="_blank" rel="noopener">💬 ادعُ أصحابك على واتساب</a>`)
 +card(`<h2>اللاعبين (${pl.length}/${MAXP})</h2><div class="pgrid">${pl.map(p=>pcell(p,{sub:"✅ جاهز",kick:1})).join("")}</div><p class="small">كل لاعب بيفوت بيصير جاهز تلقائياً، بدون ما نستناه</p>${RM.jerr?`<p class="small err">تعذّر تسجيلك بين اللاعبين (${esc(RM.jerr)})، تأكد من قواعد Firebase</p>`:""}`)
 +(RM.host?(pl.length>=2?btn("rstart","🚀 ابدأ اللعبة","","gold"):`<button class="btn gold" disabled>🚀 ابدأ اللعبة</button><p class="small">لازم لاعبين اثنين على الأقل، شارك الرابط مع أصحابك</p>`):card(`<p>بانتظار المضيف يبدأ اللعبة، جهّز حالك 😎</p>`))
 +btn("rleave",RM.host?"إنهاء الغرفة":"الخروج من الغرفة","","ghost")+err()}
function rVote(r){const i=r.round,q=rq(r,i),pl=rpl(),vs=rvs(r,i),mine=vs[S.u.uid],voted=pl.filter(p=>vs[p.uid]).length;
 if(!q)return card(`<div class="hero">⚠️</div><h2>السؤال مش متوفر</h2>${btn("rleave","خروج","","ghost")}`);
 const dots=`<div class="dots">${Array.from({length:r.n},(_,k)=>`<i class="${k<=i?"on":""}"></i>`).join("")}</div>`;
 const body=r.game==="who"
  ?`<div class="pgrid ${mine?"dim":""}">${pl.map(p=>`<button class="pl ${mine&&mine.choice===p.uid?"sel":""}" data-a="rvote" data-v="${esc(p.uid)}" ${mine?"disabled":""}>${av(p.avatar,54,p.name)}<span class="nm">${esc(p.name)}</span></button>`).join("")}</div>`
  :`<div class="list">${q.o.map((o,k)=>`<button class="opt ${mine?(String(mine.choice)===String(k)?"sel":"dim"):""}" data-a="rvote" data-v="${k}" ${mine?"disabled":""}><span>${o.e}</span>${esc(o.t)}</button>`).join("")}</div>`;
 const strip=`<div class="vstrip">${pl.map(p=>`<span title="${esc(p.name)}">${av(p.avatar,28,p.name,vs[p.uid]?"on":"")}</span>`).join("")}</div>`;
 return rbar()+dots+(r.tm?`<div class="cd" id="rcd">⏳ ${rleft(r)} ث</div>`:"")
  +card(`<div class="small">${r.game==="who"?"مين فينا؟":"لو خيروك"}، سؤال ${i+1} من ${r.n}</div><h2>${esc(rtx(r,q))}</h2>${body}${mine?`<p class="ok" style="font-weight:800;margin:12px 0 0">✅ تم تسجيل صوتك (${voted}/${pl.length})</p>`:`<p class="small">اختار بسرعة، اللعبة ما بتستنى حدا ⚡</p>`}${strip}`)
  +(RM.verr?`<p class="small err">${esc(RM.verr)}</p>`:"")}
function rReveal(r){const i=r.round,q=rq(r,i),vs=rvs(r,i),mine=vs[S.u.uid],last=i>=r.n-1,es=Object.entries(vs);let body="";
 if(!q)return card(`<div class="hero">⚠️</div><h2>السؤال مش متوفر</h2>`);
 if(r.game==="wyr"){const cnt=[0,0],who=[[],[]];es.forEach(([u,x])=>{const c=+x.choice;if(c===0||c===1){cnt[c]++;who[c].push(u)}});const t=cnt[0]+cnt[1],mx=Math.max(cnt[0],cnt[1]);
  body=q.o.map((o,k)=>{const p=t?Math.round(cnt[k]/t*100):0,win=t&&cnt[k]===mx&&cnt[0]!==cnt[1];
   return`<div class="ropt ${win?"win":""}"><div class="rh"><span>${o.e}</span>${esc(o.t)}<b>${p}%</b></div><div class="bar g"><i style="width:${p}%"></i></div><div class="vv">${who[k].map(u=>`<span title="${esc(rnm(u).n)}">${av(rnm(u).av,30,rnm(u).n)}</span>`).join("")}</div></div>`}).join("");
  const mc=mine?+mine.choice:-1,verdict=!mine?"":cnt[0]===cnt[1]?"تعادل! 🤝":(cnt[mc]===mx?"أنت مع الأغلبية 👥":"أنت ضد التيار 😎");
  if(verdict)body+=`<p style="font-weight:800;margin:12px 0 0">${verdict}</p>`}
 else{const cnt={};es.forEach(([u,x])=>{if(RM.names[x.choice])cnt[x.choice]=(cnt[x.choice]||0)+1});
  const list=Object.entries(cnt).sort((a,b)=>b[1]-a[1]),t=list.reduce((a,b)=>a+b[1],0),mx=list.length?list[0][1]:0,top=list.filter(([,n])=>n===mx).map(([u])=>u);
  body=list.length?`<div class="rwin"><span class="crown">👑</span>${av(rnm(top[0]).av,92,rnm(top[0]).n)}<h2 style="margin:0">${top.map(u=>esc(rnm(u).n)).join(" و ")}</h2><span class="small">${mx} من ${t} صوت</span></div>`
   +list.map(([u,n])=>`<div class="rrow">${av(rnm(u).av,34,rnm(u).n)}<span class="nm">${esc(rnm(u).n)}</span><em>${n} (${Math.round(n/t*100)}%)</em></div>`).join(""):'<p class="small">ما حدا صوّت بهالجولة 🤷</p>'}
 return rbar()+card(`<div class="small">${r.game==="who"?"مين فينا؟":"لو خيروك"}، سؤال ${i+1} من ${r.n}</div><h2>${esc(rtx(r,q))}</h2>${body}`)

function rEnd(r){const rows=rScores(r),title=r.game==="who"?"⭐ نجم الغرفة":"🧠 عقل الجماعة";
 const recap=Array.from({length:r.n||0},(_,i)=>{const q=rq(r,i),es=Object.entries(rvs(r,i));if(!q||!es.length)return"";
  if(r.game==="who"){const c={};es.forEach(([u,x])=>{if(RM.names[x.choice])c[x.choice]=(c[x.choice]||0)+1});const l=Object.entries(c).sort((a,b)=>b[1]-a[1]);return l.length?`<div>${i+1}. ${esc(q)}<br><b>${esc(rnm(l[0][0]).n)}</b> (${l[0][1]})</div>`:""}

document.addEventListener("change",async e=>{if(e.target.id!=="avf")return;const f=e.target.files&&e.target.files[0];if(!f)return;try{setAvatar(await fileToAvatar(f));render()}catch(x){toast("تعذّر قراءة الصورة، جرّب صورة ثانية")}});

async function syncAlias(){if(!own())return;
 try{const v=(await W(get(ref(db,"users/"+S.u.uid)))).val();
  if(v&&v.al&&v.n){S.alias=v.n;S.name=v.n;try{localStorage.setItem("bainna_alias",v.n)}catch(e){}}
  else if(S.alias)await W(update(ref(db,"users/"+S.u.uid),{n:S.alias,al:1}));
  if(v&&typeof v.avatar==="string"&&v.avatar)setAvatar(v.avatar);else if(S.avatar)await W(update(ref(db,"users/"+S.u.uid),{avatar:S.avatar}))}catch(e){}}
async function restore(){const d=loadSt();if(!d||!d.s)return;const s=d.s;
 if(RC)return;
 if(M){if(S.s==="msend")S.mt=d.mt||"";return}
 if(PL){if(S.s==="pvote"&&s==="pvote"){S.i=Math.min(+d.i||0,S.pl.q.length-1);S.pa=Array.isArray(d.pa)?d.pa:[]}return}
 if(WH){if(S.s==="whome"&&s==="wvote"){S.i=Math.min(+d.i||0,S.wl.q.length-1);S.wa=Array.isArray(d.wa)?d.wa:[];S.s="wvote"}return}
 if(Q){if(S.rv||!["name","q","result"].includes(s))return;
  S.name=d.name||S.name;S.i=Math.min(+d.i||0,S.qs.length-1);S.ans=d.ans||[];S.s=s;
  if(s==="result"){S.score=d.score||0;S.board=[];wq(Q)}return}
 if(!own())return;
 if(s==="dash")return A.dash();
 if(s==="inbox")return A.inbox();
 if(s==="qbuild"){if(!d.cq)return;S.cq=d.cq;S.custom=true}
 else if(s==="q"){S.qs=(Array.isArray(d.qs)&&d.qs.length)?d.qs:shuf(PRE).slice(0,10);S.custom=false;S.i=Math.min(+d.i||0,S.qs.length-1);S.ans=d.ans||[]}
 else if(s==="pbuild"){if(!d.pq)return;S.pq=d.pq;S.dur=d.dur||864e5}
 else if(s==="share"){if(!d.id)return;S.id=d.id;S.board=[];wq(d.id)}
 else if(s==="pres"){if(!d.pid||!d.pl)return;S.pid=d.pid;S.pl=d.pl;S.end=d.end;S.cnt={};wp(d.pid)}
 else if(s==="wbuild"){if(!d.wb)return;S.wb=d.wb}
 else if(s==="wres"){if(!d.wid||!d.wl)return;S.wid=d.wid;S.wl=d.wl;S.wcnt={};ww(d.wid)}
 else if(s==="wheel"||s==="tod"){}
 else if(s==="wyr"||s==="wyres"){if(!d.wy)return;S.wy=d.wy}
 else if(s!=="mode")return;
 S.name=d.name||dn();S.bk="home";S.s=s}
async function boot(){
 try{
  if(Q){const d=(await W(get(ref(db,"quizzes/"+Q)))).val();if(!d)throw 0;S.fq={a:d.a};S.owner=d.n;S.qs=d.q?d.q.map(x=>({q:x.q,o:x.o.map(dq)})):PRE0;S.s="home";
   let sc=null;try{sc=(await W(get(ref(db,`scores/${Q}/${S.u.uid}`)))).val()}catch(e){}
   if(!sc){try{sc=JSON.parse(localStorage.getItem("fqd_"+Q)||"null")}catch(e){}}
   if(sc&&typeof sc.s==="number"){S.rv=1;S.score=sc.s;S.name=sc.n||S.name;S.board=[];S.s="result";wq(Q)}}
  else if(PL){const d=(await W(get(ref(db,"polls/"+PL)))).val();if(!d)throw 0;S.pl=d;S.end=d.end;let v=false;try{v=(await W(get(ref(db,`pv/${PL}/${S.u.uid}`)))).exists()}catch(e){}if(!v){try{v=!!localStorage.getItem("pv_"+PL)}catch(e){}}
   if(d.end<=Date.now()){S.msg="انتهى التصويت";S.s="pdone"}else if(v){S.msg="صوّتّ من قبل، التصويت مرة وحدة لكل شخص";S.s="pdone"}else S.s="pvote"}
  else if(WH){const d=(await W(get(ref(db,"whos/"+WH)))).val();if(!d||!d.q||!d.c)throw 0;S.wl={q:d.q,c:d.c,n:d.n};let v=false;try{v=(await W(get(ref(db,`wv/${WH}/${S.u.uid}`)))).exists()}catch(e){}if(!v){try{v=!!localStorage.getItem("wv_"+WH)}catch(e){}}
   if(v){S.msg="صوّتّ من قبل، التصويت مرة وحدة لكل شخص";S.s="wdone";ww(WH)}else S.s="whome"}
  else if(M){S.mn=(await W(get(ref(db,"users/"+M+"/n")))).val();if(!S.mn)throw 0;S.s="msend"}
  else if(RC){await rEnter(RC)}
 }catch(e){S.s="bad";S.msg=e&&e.code?String(e.code):""}
 if(S.s!=="bad"){try{await restore()}catch(x){}}
 if(!Q&&!PL&&!M&&!WH&&S.s==="welcome"&&S.alias)S.s="home";
 render()}
trap();
if(CFG.apiKey){
 au=getAuth(initializeApp(CFG));db=getDatabase();
 onAuthStateChanged(au,async u=>{S.u=u;
  if(!u&&(Q||PL||M||WH||RC)){signInAnonymously(au).catch(e=>{S.booted=1;S.s="bad";S.msg=ec(e);render()});return}
  if(own())await syncAlias();
  if(!S.booted){S.booted=1;await boot()}else render();
  if(own()){let k=null;try{k=sessionStorage.getItem("pend");sessionStorage.removeItem("pend")}catch(x){}if(k)A.need(k)}})
}else render();
