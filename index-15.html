q(){const q=S.qs[S.i],f=!!S.fq;return`<div class="dots">${S.qs.map((_,k)=>`<i class="${k<=S.i?"on":""}"></i>`).join("")}</div>`+card(`<div class="small">${f?"سؤال عن "+esc(S.owner):"جاوب عن نفسك"} · ${S.i+1} / ${S.qs.length}</div><h2>${esc(q.q)}</h2>${optH(q,"pick")}`)},

share:()=>card(`<div class="hero">🔗</div><h2>شارك اختبارك مع أصحابك وشوف مين بعرفك أكثر! 💙</h2>${cp(BASE+"?q="+S.id)}`)+board(),

pres:()=>cd()+card(`<h2>📊 نتائج التصويت</h2>${res()||"..."}`)+card(`<h2>رابط التصويت</h2>${cp(BASE+"?p="+S.pid)}`),

msend:()=>card(`<div class="hero">💌</div><h2>ابعت رسالة لـ${esc(S.mn)}</h2><p class="small">ما حدا رح يعرف إنك إنت</p><textarea class="t" data-k="mt" maxlength="500" placeholder="اكتب رسالتك...">${esc(S.mt)}</textarea>${btn("send","ارسل بصفة مجهول 🕵️")}${err()}`),
msent:()=>card(`<div class="hero">✅</div><h2>انرسلت الرسالة</h2>${btn("again","ابعت رسالة ثانية","","soft")}`)+card(`<h2>بدك رسائل مجهولة إلك؟</h2>${btn("home","ابدأ من الرئيسية")}`),
inbox:()=>card(`<h2>🔗 رابط رسائلك</h2>${cp(BASE+"?m="+S.u.uid)}${err()}`)+card(`<h2>📥 الرسائل المرسلة إلك</h2>${S.msgs.length?S.msgs.map(([k,m])=>`<div class="msg">${esc(m.t)}<small><span>${new Date(m.ts).toLocaleString("ar")}</span><a data-a="del" data-v="${k}">حذف</a></small></div>`).join(""):'<span class="small">ما وصلتك رسائل بعد...</span>'}`),
wbuild:()=>card(`<h2>👥 مين فينا؟</h2><p class="small">ضيف أسماء الشلة (وإنت منهم)، واختار الأسئلة، وأصحابك بيصوتوا مين بنطبق عليه كل سؤال. التصويت مجهول.</p>`)+card(`<h3>1) أسماء الشلة</h3>`+S.wb.names.map((n,i)=>inp(`wb.names.${i}`,"اسم "+(i+1),n)).join("")+(S.wb.names.length<12?btn("waddn","+ اسم جديد","","soft"):""))+card(`<h3>2) الأسئلة</h3><p class="small">كم سؤال بدك؟</p><div class="hl">${[5,7,10].map(n=>`<button class="mini ${S.wb.q.length===n?"gold":""}" data-a="wcount" data-v="${n}">${n}</button>`).join("")}</div>`+S.wb.q.map((q,i)=>`<div class="itm"><div class="bq" style="flex:1;margin:0">${i+1}. ${esc(q)}</div><button class="mini" data-a="wswap" data-v="${i}" aria-label="غيّر السؤال">🔄</button><button class="mini" data-a="wremq" data-v="${i}" aria-label="احذف السؤال">✕</button></div>`).join("")+btn("wshuf","🎲 خلط كل الأسئلة","","soft")+`<p class="small">أو اكتب سؤالك بنفسك:</p><input class="t" data-k="wb.cust" maxlength="120" placeholder="مين أكثر واحد...؟" value="${esc(S.wb.cust)}">${btn("waddc","+ أضف سؤالي","","soft")}`)+btn("savew","ابدأ التحدي وانشر الرابط 🚀")+err(),
wres:()=>card(`<h2>🔗 رابط التحدي</h2><p class="small">ابعته لأصحابك وخليهم يصوتوا</p>${cp(BASE+"?w="+S.wid)}`)+card(`<h2>🏆 تقرير الأصحاب</h2>${wsum()}`)+card(`<h2>📊 نتائج التصويت</h2>${wresH()||"..."}`),
whome:()=>card(`${logo(true)}<h1>مين فينا؟ 👀</h1><p>صوّت على أصحابك بأسئلة طريفة من ${esc(S.wl.n)}، وما حدا رح يعرف إنك إنت</p>${btn("wstart","يلا نبدأ")}`),
wvote(){const q=S.wl.q[S.i];return`<div class="dots">${S.wl.q.map((_,k)=>`<i class="${k<=S.i?"on":""}"></i>`).join("")}</div>`+card(`<div class="small">مين فينا من ${esc(S.wl.n)} · ${S.i+1} / ${S.wl.q.length}</div><h2>${esc(q)}</h2>${err()}${optH({o:S.wl.c.map(t=>({t,e:""}))},"wv")}`)},
wdone:()=>card(`<div class="hero">👥</div><h2>${S.msg||"وصل صوتك، شكراً!"}</h2>`)+card(`<h2>بدك تعمل تحدي مين فينا الخاص فيك؟</h2>${btn("home","ابدأ من الرئيسية")}`),
wheel:()=>card(`<h2>🎡 دولاب الحظ</h2><p class="small">ضيف الأسماء تحت كل دولاب، واضغط على الدولاب أو زر اللف، وشوف الحظ مين بيختار!</p>`)+[0,1].map(i=>card(`<h2>دولاب ${i+1}</h2><div class="wheel-box"><div class="ptr"></div><canvas id="wc${i}" width="600" height="600" data-a="wspin" data-v="${i}" aria-label="دولاب ${i+1}"></canvas></div><button class="btn" id="wb${i}" data-a="wspin" data-v="${i}">🎯 لفّ الدولاب</button><div class="orow"><input class="t" id="wi${i}" data-wi="${i}" maxlength="20" placeholder="اكتب اسم وأضفه..."><button class="btn soft wadd" data-a="wadd" data-v="${i}" aria-label="إضافة">+</button></div><p class="small err" id="wm${i}"></p><div class="chips" id="wch${i}">${chips(i)}</div><button class="mini" id="wcl${i}" data-a="wclear" data-v="${i}" ${WL[i].n.length?"":"hidden"}>🗑️ مسح كل الأسماء</button>`)).join("")+`<div id="wov"></div>`,
tod:()=>card(`<h2>🎯 صراحة أو جرأة</h2><p class="small">دوّر العجلة وشوف شو الحظ حاططلك: سؤال صراحة ولا تحدي جرأة؟</p>`)+card(`<div class="wheel-box"><div class="ptr"></div><canvas id="tc" width="600" height="600" data-a="todspin" aria-label="عجلة صراحة أو جرأة"></canvas></div><button class="btn" id="tb" data-a="todspin">🎡 دوّر العجلة</button>`)+`<div id="tcard"></div>`,
wyr(){const w=S.wy,it=w.q[w.i],sel=w.sel,p=w.p[w.i];return`<div class="dots">${w.q.map((_,k)=>`<i class="${k<=w.i?"on":""}"></i>`).join("")}</div>`+card(`<div class="small">لو خيروك · ${w.i+1} / ${w.q.length}</div><h2>${esc(it.q)}</h2>`+(sel==null?optH({o:it.o},"wyp"):`<div class="list">${it.o.map((o,k)=>`<div class="opt ${k===sel?"sel":""}"><span>${o.e}</span>${esc(o.t)}<b>${p?p[k]+"%":"—"}</b></div>${p?`<div class="bar g"><i style="width:${p[k]}%"></i></div>`:""}`).join("")}</div>${p?"":'<p class="small">نسب الأصوات مش متوفرة هلق</p>'}`+btn("wynext",w.i<w.q.length-1?"التالي ➡️":"عرض النتيجة 🏁"))+err())},
wyres(){const w=S.wy;let m=0,n=0;const rows=w.q.map((it,i)=>{const a=w.a[i],p=w.p[i];if(a==null)return"";let mj="";if(p){n++;if(p[a]>=p[1-a]){m++;mj=" 👥"}}return`<div class="sum"><span>${i+1}. ${esc(it.o[a].t)}</span><b>${p?p[a]+"%":"—"}${mj}</b></div>`}).join("");
 return card(`<div class="hero">⚖️</div><h2>خلصت اللعبة!</h2>${n?`<p>كنت مع أغلبية الناس بـ <b>${m}</b> من ${n} أسئلة 👥</p>`:""}`)+card(`<h2>اختياراتك</h2>${rows}`)+card(`<h2>شارك اللعبة مع أصحابك 💙</h2>${cp(BASE)}`)+btn("wyagain","🔄 العب مرة تانية")+btn("home","الصفحة الرئيسية","","soft")},
dash:()=>card(`<h2>📊 مساحتي</h2>${err()}${btn("inbox","📥 صندوق الرسائل","","soft")}${Object.entries(S.items).sort((a,b)=>b[1].ts-a[1].ts).map(([id,x])=>`<div class="itm"><button class="opt" data-a="open" data-v="${x.k}:${id}"><span>${x.k==="q"?"📝":x.k==="w"?"👥":"🗳️"}</span>${x.k==="q"?"اختبار":x.k==="w"?"مين فينا":"التصويت"} ${esc(x.t)}</button><button class="dl" data-a="delItem" data-v="${x.k}:${id}" aria-label="حذف">🗑️</button></div>`).join("")||'<p class="small">ما عملت شي بعد</p>'}`)
};
function render(){app.innerHTML=hdr()+(CFG.apiKey?V[S.s]():card("<h2>ناقص apiKey</h2><p class='small'>حط apiKey و appId من إعدادات Firebase بالملف</p>"))+foot();save();if(S.s==="wheel")wheelInit();else if(S.s==="tod")todInit()}
function go(s){S.s=s;if(S.unsub&&!["share","result","pres","inbox","wres"].includes(s)){S.unsub();S.unsub=null}render();scrollTo(0,0)}
function watch(p,fn){if(S.unsub)S.unsub();S.unsub=onValue(ref(db,p),sn=>fn(sn.val()),()=>{})}
const R=(i,k)=>{const e=$(i);if(e)e.innerHTML=k()};
const wq=id=>watch("scores/"+id,v=>{S.board=Object.values(v||{});R("#board",rows)});
const wp=id=>watch("pc/"+id,v=>{S.cnt=v||{};const e=$("#app .card:nth-of-type(1)");if(S.s==="pres")render()});
const ww=id=>watch("wc/"+id,v=>{S.wcnt=v||{};if(S.s==="wres")render()});
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const item=(id,k,t)=>set(ref(db,`userItems/${S.u.uid}/${id}`),{k,t,ts:Date.now()});
const A={
th(){document.documentElement.dataset.theme=T()==="madrid"?"dark":"madrid";try{localStorage.setItem("th",T())}catch(e){}render()},
async google(){const pr=new GoogleAuthProvider();try{const r=await signInWithPopup(au,pr);S.u=r.user;await syncAlias();let k=null;try{k=sessionStorage.getItem("pend");sessionStorage.removeItem("pend")}catch(x){}if(k)A.need(k);else render()}catch(e){if(e.code==="auth/popup-blocked"||e.code==="auth/operation-not-supported-in-this-environment"){try{await signInWithRedirect(au,pr);return}catch(e2){e=e2}}S.msg="تعذّر الدخول ("+(e.code||e.message)+")";render()}},
async out(){try{sessionStorage.removeItem("st")}catch(e){}await signOut(au);S.s="home";render()},
home(){S.msg="";S.busy=0;if(Q||PL||M||WH)location.href=BASE;else go("home")},
async saveAlias(){const e=$("#aliasInput"),v=(e?.value||"").trim();if(!v){S.msg="اكتب اسم مستعار أولًا";render();$("#aliasInput")?.focus();return}S.alias=v;S.name=v;try{localStorage.setItem("bainna_alias",v)}catch(e){}S.msg="";
 if(own()){try{await W(set(ref(db,"users/"+S.u.uid),{n:v,al:1}))}catch(e){S.msg="تعذّر حفظ الاسم ("+ec(e)+")";render();return}}
 if(S.pk&&own()){const k=S.pk;S.pk=null;A.need(k)}else go("home")},
editAlias(){S.msg="";S.pk=null;go("alias")},
copy(v,b){copyText(v).then(ok=>b.textContent=ok?"تم النسخ ✓":"انسخ الرابط يدوياً من فوق")},
tt(v,b){copyText(v).then(ok=>{b.textContent=ok?"تم النسخ ✓":"انسخ الرابط يدوياً من فوق";open("https://www.tiktok.com/","_blank")})},
need(k){if(k==="wheel"||k==="tod"){S.msg="";go(k);return}if(!own()){try{sessionStorage.setItem("pend",k)}catch(e){}S.msg="";A.google();return}if(!S.alias){S.pk=k;S.msg="";go("alias");return}S.msg="";S.name=dn();
 if(k==="quiz")go("mode");else if(k==="poll"){S.pq=[{q:"",o:["","","",""]}];S.dur=864e5;go("pbuild")}else if(k==="who"){S.wb=newWho();S.i=0;go("wbuild")}else if(k==="wyr"){S.wy=newWyr();go("wyr")}else A.inbox()},
start(){if(S.rv)return;S.msg="";if(own()){S.name=dn();S.i=0;S.ans=[];go("q");return}S.name=S.alias||S.name;go("name")},
setname(){const v=$("#nm").value.trim();if(!v){S.msg="اكتب اسمك المستعار أولًا";render();$("#nm")?.focus();return}S.name=v;S.alias=v;try{localStorage.setItem("bainna_alias",v)}catch(e){}S.i=0;S.ans=[];go("q")},
mode(v){S.i=0;S.ans=[];S.msg="";S.custom=v==="o";if(v==="r"){S.qs=shuf(PRE).slice(0,10);go("q")}else{S.cq=[0,1,2].map(()=>({q:"",o:["","",""],c:0}));go("qbuild")}},
cor(v){const[i,j]=v.split(".");S.cq[i].c=+j;render()},
addq(){S.cq.push({q:"",o:["","",""],c:0});render()},
async saveq(){S.msg="";const out=[];
 for(const c of S.cq){const q=c.q.trim();if(!q&&c.o.every(x=>!x.trim()))continue;const op=c.o.map((t,j)=>({t:t.trim(),j})).filter(x=>x.t);
  if(!q||op.length<2||!c.o[c.c].trim()){S.msg="كمّل كل سؤال: نص السؤال + خيارين على الأقل + الجواب الصح";render();return}
  out.push({q,o:op.map(x=>({t:x.t,e:""})),a:op.findIndex(x=>x.j===c.c)})}
 if(out.length<3){S.msg="أقل شي 3 أسئلة";render();return}
 S.qs=out;S.ans=out.map(x=>x.a);A.publishQ()},
async publishQ(){if(S.busy)return;S.busy=1;const id=rid();S.msg="";S.lt="جاري نشر الاختبار...";go("load");
 try{await W(set(ref(db,"quizzes/"+id),{o:S.u.uid,n:S.name||dn(),a:S.ans,q:S.qs.map(x=>({q:x.q,o:x.o.map(y=>y.e?y.e+"§"+y.t:y.t)})),ts:Date.now()}))}
 catch(e){S.busy=0;S.msg="تعذّر الحفظ ("+ec(e)+")، تأكد من قواعد Firebase";go(S.custom?"qbuild":"perr");return}
 S.busy=0;item(id,"q",S.name||dn()).catch(()=>{});S.id=id;S.bk="home";S.board=[];go("share");wq(id)},
async pick(v){if(lock)return;lock=1;const c=+v,bs=document.querySelectorAll(".opt");
 if(S.fq){const a=S.fq.a[S.i];bs.forEach((b,k)=>b.classList.add(k===a?"ok":k===c?"bad":"dim"))}else bs[c]?.classList.add("sel");
 await wait(S.fq?1300:450);lock=0;S.ans[S.i]=c;
 if(S.i<S.qs.length-1){S.i++;render();return}
 if(S.fq){S.score=S.ans.reduce((a,x,k)=>a+(x===S.fq.a[k]?1:0),0);S.board=[];S.rv=0;go("result");wq(Q);
  try{localStorage.setItem("fqd_"+Q,JSON.stringify({s:S.score,n:S.name}))}catch(e){}
  try{await set(ref(db,`scores/${Q}/${S.u.uid}`),{n:S.name,s:S.score,t:S.qs.length,ts:Date.now()})}catch(e){}}
 else A.publishQ()},
addp(){S.pq.push({q:"",o:["","","",""]});render()},
async savep(){if(S.busy)return;S.msg="";const q=[];
 for(const c of S.pq){const o=c.o.map(x=>x.trim()).filter(Boolean);if(!c.q.trim()||o.length<2){S.msg="كمّل كل سؤال: نص السؤال + خيارين على الأقل";render();return}q.push({q:c.q.trim(),o})}
 S.busy=1;const id=rid(),end=Date.now()+Number(S.dur);S.lt="جاري نشر التصويت...";go("load");
 try{await W(set(ref(db,"polls/"+id),{o:S.u.uid,n:dn(),q,end,ts:Date.now()}))}
 catch(e){S.busy=0;S.msg="تعذّر الحفظ ("+ec(e)+")، تأكد من قواعد Firebase";go("pbuild");return}
 S.busy=0;item(id,"p",q[0].q.slice(0,25)).catch(()=>{});S.pid=id;S.pl={q,end,n:dn()};S.end=end;S.cnt={};S.bk="home";go("pres");wp(id)},
async vote(v){if(lock||S.busy)return;lock=1;S.msg="";document.querySelectorAll(".opt")[+v]?.classList.add("sel");await wait(400);lock=0;S.pa[S.i]=+v;
 if(S.i<S.pl.q.length-1){S.i++;render();return}
 S.busy=1;S.lt="جاري إرسال صوتك...";go("load");
 try{await W(set(ref(db,`pv/${PL}/${S.u.uid}`),true));try{localStorage.setItem("pv_"+PL,"1")}catch(x){}}
 catch(e){S.busy=0;if(ec(e)==="timeout"){S.msg="النت ضعيف، جرّب مرة ثانية";go("pvote")}else{S.msg="صوّتّ من قبل أو انتهى التصويت (التصويت مرة وحدة لكل شخص)";go("pdone")}return}
 try{await W(Promise.allSettled(S.pa.map((a,i)=>runTransaction(ref(db,`pc/${PL}/${i}/${a}`),x=>(x||0)+1))))}catch(e){}
 S.busy=0;S.msg="";go("pdone")},
async open(v){const[k,id]=v.split(":");S.bk="dash";S.msg="";
